<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Designer — 本地优先的可视化 HTML 工作台</title>
  <meta name="description" content="HTML Designer 是一个本地优先的可视化 HTML 工作台，支持画布编辑、源码模式、本地保存和 AI 辅助设计。">
  <meta name="author" content="lamp-cat">
  <meta name="theme-color" content="#10131a">
  <link rel="canonical" href="https://lamp-cat.github.io/html-designer/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="HTML Designer">
  <meta property="og:description" content="打开 HTML，直接在画布上编辑，然后保存回本地。">
  <meta property="og:url" content="https://lamp-cat.github.io/html-designer/">
  <meta property="og:image" content="https://lamp-cat.github.io/html-designer/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="HTML Designer">
  <meta name="twitter:description" content="本地优先的可视化 HTML 工作台。">
  <meta name="twitter:image" content="https://lamp-cat.github.io/html-designer/og-image.png">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "HTML Designer",
    "url": "https://lamp-cat.github.io/html-designer/",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Any",
    "description": "A local-first visual workspace for editing standalone HTML documents.",
    "creator": { "@type": "Person", "name": "lamp-cat" },
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="css/studio.css?v=1">
</head>
<body>
  <section class="welcome" id="welcome">
    <header class="welcome-nav">
      <a class="wordmark" href="./" aria-label="HTML Designer 首页">
        <img src="logo-inverted.png" alt="">
        <span>HTML Designer</span>
      </a>
      <div class="welcome-nav-actions">
        <a href="HTML_DESIGNER_USER_GUIDE.md" target="_blank" rel="noopener">使用指南</a>
        <button class="icon-button" id="welcome-theme" type="button" title="切换主题">◐</button>
      </div>
    </header>

    <main class="welcome-main">
      <div class="welcome-copy">
        <p class="eyebrow">LOCAL-FIRST · VISUAL HTML WORKSPACE</p>
        <h1>把 HTML 放到画布上，<br><span>直接完成设计。</span></h1>
        <p class="welcome-lead">无需上传项目，也不绑定框架。打开单个 HTML 文件，在真实页面上修改文字、结构和样式，再保存回本地。</p>
      </div>

      <div class="launch-grid" aria-label="开始使用">
        <button class="launch-card primary" id="action-open" type="button">
          <kbd>A</kbd><span class="launch-icon">↗</span>
          <strong>打开本地文件</strong>
          <small>建立可写连接，保存回原文件</small>
        </button>
        <button class="launch-card" id="action-import" type="button">
          <kbd>B</kbd><span class="launch-icon">⇣</span>
          <strong>导入 HTML</strong>
          <small>只读导入，完成后下载副本</small>
        </button>
        <button class="launch-card" id="action-new" type="button">
          <kbd>C</kbd><span class="launch-icon">＋</span>
          <strong>新建设计</strong>
          <small>从响应式空白模板开始</small>
        </button>
        <button class="launch-card" id="action-ai" type="button">
          <kbd>D</kbd><span class="launch-icon">✦</span>
          <strong>AI Design</strong>
          <small>用本机 Codex 或 Claude 生成页面</small>
        </button>
      </div>

      <button class="restore-card" id="action-restore" type="button" hidden>
        <span>恢复上次未完成的编辑</span><small id="restore-meta"></small>
      </button>
      <p class="drop-note">也可以把 .html 文件拖到这个页面</p>
    </main>

    <footer class="welcome-footer">
      <span>文件默认留在你的设备上</span>
      <span>HTML Designer · v1</span>
    </footer>
  </section>

  <div class="studio" id="studio" hidden>
    <header class="topbar">
      <div class="topbar-brand">
        <button class="brand-button" id="home-button" type="button" title="返回首页">
          <img src="logo-inverted.png" alt=""><span>HTML Designer</span>
        </button>
        <div class="mode-switch" id="mode-switch" role="tablist" aria-label="编辑模式">
          <button class="active" type="button" data-mode="visual">画布</button>
          <button type="button" data-mode="source">源码</button>
        </div>
        <div class="document-state">
          <strong id="document-name">untitled.html</strong>
          <span id="document-status">已保存</span>
        </div>
      </div>

      <div class="topbar-tools" aria-label="编辑工具">
        <button type="button" id="undo-button" title="撤销">↶</button>
        <button type="button" id="redo-button" title="重做">↷</button>
        <span class="tool-divider"></span>
        <button type="button" id="duplicate-button" title="复制元素">⧉</button>
        <button type="button" id="delete-button" title="删除元素">⌫</button>
        <button type="button" id="parent-button" title="选择父元素">↰</button>
        <span class="tool-divider"></span>
        <button class="device-button active" type="button" data-device="desktop" title="桌面">▱</button>
        <button class="device-button" type="button" data-device="tablet" title="平板">▯</button>
        <button class="device-button" type="button" data-device="mobile" title="手机">▯</button>
        <span class="tool-divider"></span>
        <button type="button" id="preview-button" title="沉浸预览">◎</button>
        <button type="button" id="external-preview-button" title="在新标签页运行页面">↗</button>
        <button class="accent-tool" type="button" id="ai-button">✦ AI Design</button>
      </div>

      <div class="topbar-file">
        <button type="button" id="open-button">打开</button>
        <button type="button" id="refresh-button" title="重新读取磁盘文件" disabled>刷新</button>
        <button type="button" id="diff-button" title="比较磁盘与编辑器" disabled>对比</button>
        <button type="button" id="import-button">导入</button>
        <button type="button" id="export-button">导出</button>
        <button class="save-button" type="button" id="save-button">保存</button>
        <button class="icon-button" type="button" id="theme-button" title="切换主题">◐</button>
      </div>
    </header>

    <main class="studio-grid">
      <aside class="rail left-rail">
        <nav class="rail-tabs" data-tabs="left">
          <button class="active" type="button" data-panel="library">组件</button>
          <button type="button" data-panel="outline">结构</button>
          <button type="button" data-panel="snippets">片段</button>
        </nav>
        <section class="rail-panel active" data-panel="library">
          <label class="search-box"><span>⌕</span><input id="block-search" type="search" placeholder="搜索组件"></label>
          <div class="block-list" id="block-list"></div>
        </section>
        <section class="rail-panel" data-panel="outline">
          <div class="tree" id="element-tree"></div>
        </section>
        <section class="rail-panel" data-panel="snippets">
          <button class="wide-button" id="save-snippet-button" type="button" disabled>保存当前元素为片段</button>
          <div class="snippet-list" id="snippet-list"></div>
        </section>
      </aside>

      <section class="workbench" id="workbench">
        <div class="canvas-shell" id="canvas-shell" data-device="desktop">
          <iframe id="design-canvas" title="HTML 设计画布" sandbox="allow-same-origin allow-forms"></iframe>
          <div class="selection-layer" id="selection-layer" hidden>
            <div class="selection-frame" id="selection-frame"></div>
            <div class="selection-label" id="selection-label"></div>
            <div class="selection-actions" id="selection-actions">
              <button type="button" data-command="edit">编辑文字</button>
              <button type="button" data-command="before">上移</button>
              <button type="button" data-command="after">下移</button>
              <button type="button" data-command="review">批注</button>
              <button type="button" data-command="duplicate">复制</button>
              <button type="button" data-command="remove">删除</button>
            </div>
            <button class="resize-knob resize-x" type="button" data-resize="x" aria-label="调整宽度"></button>
            <button class="resize-knob resize-y" type="button" data-resize="y" aria-label="调整高度"></button>
            <button class="resize-knob resize-xy" type="button" data-resize="xy" aria-label="调整尺寸"></button>
          </div>
          <div class="hover-frame" id="hover-frame" hidden></div>
          <div class="drop-marker" id="drop-marker" hidden></div>
        </div>
        <div class="source-shell" id="source-shell" hidden>
          <div class="source-head"><span>HTML SOURCE</span><small>切回画布时会重新解析文档</small></div>
          <textarea id="source-editor" spellcheck="false" aria-label="HTML 源码"></textarea>
        </div>
      </section>

      <aside class="rail right-rail">
        <nav class="rail-tabs" data-tabs="right">
          <button class="active" type="button" data-panel="style">样式</button>
          <button type="button" data-panel="attributes">属性</button>
          <button type="button" data-panel="behavior">交互</button>
          <button type="button" data-panel="markup">HTML</button>
        </nav>
        <section class="rail-panel active inspector" data-panel="style" id="style-inspector"></section>
        <section class="rail-panel inspector" data-panel="attributes" id="attribute-inspector"></section>
        <section class="rail-panel inspector" data-panel="behavior" id="behavior-inspector"></section>
        <section class="rail-panel inspector" data-panel="markup" id="markup-inspector"></section>
      </aside>
    </main>

    <footer class="statusbar">
      <div class="crumbs" id="selection-path"></div>
      <div class="statusbar-meta"><span id="status-text">准备就绪</span><span id="autosave-text">尚未自动保存</span></div>
    </footer>
  </div>

  <button class="leave-preview" id="leave-preview" type="button" hidden>退出预览</button>

  <aside class="ai-drawer" id="ai-drawer" hidden>
    <header>
      <div><p>LOCAL AGENT</p><h2>AI Design</h2></div>
      <button class="icon-button" type="button" id="ai-close">×</button>
    </header>
    <div class="ai-target" id="ai-target">修改整个页面</div>
    <div class="ai-log" id="ai-log" aria-live="polite"></div>
    <details class="review-box" id="review-box">
      <summary>组件批注 <span id="review-count">0</span></summary>
      <div class="review-compose" id="review-compose" hidden>
        <strong id="review-target"></strong>
        <textarea id="review-input" rows="3" placeholder="描述希望如何修改这个组件"></textarea>
        <div><button type="button" id="review-cancel">取消</button><button type="button" id="review-add">添加批注</button></div>
      </div>
      <div id="review-list"></div>
      <button class="wide-button" type="button" id="review-send" disabled>发送选中批注</button>
    </details>
    <div class="ai-compose">
      <textarea id="ai-input" rows="5" placeholder="描述你希望生成或修改的页面……"></textarea>
      <div class="ai-actions">
        <button class="primary-action" type="button" id="ai-send">发送</button>
        <button type="button" id="ai-stop" hidden>停止</button>
      </div>
    </div>
    <details class="ai-settings">
      <summary>连接设置</summary>
      <label>Endpoint<input id="ai-endpoint" type="text" value="/api/ai-design"></label>
      <label>CLI<select id="ai-cli"><option value="codex">Codex CLI</option><option value="claude">Claude Code CLI</option></select></label>
      <label>模型（可选）<input id="ai-model" type="text" placeholder="使用 CLI 默认模型"></label>
      <div><button type="button" id="ai-save-settings">保存设置</button><button type="button" id="ai-test">测试连接</button></div>
    </details>
  </aside>

  <input id="file-picker" type="file" accept=".html,.htm,text/html" hidden>
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
  <div class="modal-root" id="modal-root"></div>

  <script type="module" src="js/studio-app.js?v=1"></script>
</body>
</html>
